name: Freshness validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  executable-docs:
    name: Weekly Playwright validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run executable documentation
        run: npm run test:docs

      - name: Freshness reminder
        run: |
          echo 'Review open Playwright dependency updates and upstream release notes.'
          echo 'Do not change Last verified markers unless the affected guidance was actually reviewed.'
